name: mil_nexus
description: Cross-platform mobile app for the UNESCO Youth Initiative 2026 MIL Nexus platform.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.5

  # Offline persistence database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Connectivity observer
  connectivity_plus: ^5.0.2

  # HTTP client
  http: ^1.1.0

  # System features
  path_provider: ^2.1.1
  flutter_svg: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
